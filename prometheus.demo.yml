# Prometheus de la stack démo : scrape le backend sur le réseau Docker.
# Les métriques upstra_* (batterie UPS, CPU/RAM des hôtes, entrée d'air,
# puissance, alertes) alimentent les graphes d'historique de l'UI.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'upstra-backend'
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ['backend:3000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
